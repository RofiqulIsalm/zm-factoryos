kind = "web"
previewPath = "/"
title = "ZM FactoryOS"
description = "A production-oriented factory management system for ZM Printing & Design Ltd., connecting jobs, clients, departments, billing, accounting, permissions, and operational insight in one reliable workspace."
version = "1.0.0"
id = "artifacts/zm-factoryos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20014

[services.development]
run = "pnpm --filter @workspace/zm-factoryos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zm-factoryos", "run", "build" ]
serve = "static"
publicDir = "artifacts/zm-factoryos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20014"
BASE_PATH = "/"
